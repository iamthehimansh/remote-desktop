<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Dashboard — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@11/dist/bundle/index.umd.min.js"></script>
<style>body{background:#09090b;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:64px 64px}</style>
</head>
<body class="min-h-screen grid place-items-center text-zinc-50">
<div id="card" class="w-[400px] max-w-[calc(100%-2rem)] p-7 rounded-xl bg-zinc-900/80 backdrop-blur border border-zinc-700">
  <h1 class="text-center font-mono font-semibold text-xl flex items-center justify-center gap-2 mb-1">
    <svg class="w-5 h-5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
    Pi Dashboard
  </h1>
  <p class="text-center text-xs text-zinc-400 mb-5">pi.himansh.in</p>
  <p id="err" class="text-red-400 text-sm text-center mb-3 min-h-[20px]"></p>

  <div id="tabs" class="grid grid-cols-3 gap-1 bg-zinc-800 rounded-lg p-1 mb-4 text-xs">
    <button data-tab="password" class="tab-btn py-1.5 rounded bg-zinc-900">Password</button>
    <button data-tab="passkey" class="tab-btn py-1.5 rounded text-zinc-400" hidden>Passkey</button>
    <button data-tab="totp" class="tab-btn py-1.5 rounded text-zinc-400" hidden>TOTP</button>
  </div>

  <form id="pane-password" data-tab="password" class="pane">
    <input id="pass" type="password" placeholder="Password" required autofocus
      class="w-full px-3 py-2.5 rounded-md bg-zinc-800 border border-zinc-700 text-zinc-50 text-sm focus:outline-none focus:border-blue-500 mb-3">
    <button type="submit" id="btn-pw" class="w-full py-2.5 rounded-md bg-blue-500 hover:bg-blue-600 text-white font-medium text-sm">Sign in</button>
  </form>

  <div id="pane-passkey" data-tab="passkey" class="pane hidden">
    <p class="text-sm text-zinc-400 mb-3">Use your registered passkey.</p>
    <button type="button" id="btn-pk" class="w-full py-2.5 rounded-md bg-blue-500 hover:bg-blue-600 text-white font-medium text-sm">Sign in with Passkey</button>
  </div>

  <form id="pane-totp" data-tab="totp" class="pane hidden">
    <input id="totp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code"
      class="w-full px-3 py-2.5 rounded-md bg-zinc-800 border border-zinc-700 text-zinc-50 text-center font-mono text-xl tracking-[0.5em] focus:outline-none focus:border-blue-500 mb-3">
    <button type="submit" id="btn-totp" class="w-full py-2.5 rounded-md bg-blue-500 hover:bg-blue-600 text-white font-medium text-sm">Verify</button>
  </form>
</div>

<script>
const err = document.getElementById('err');
function showErr(m){err.textContent=m;document.getElementById('card').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300});}
function nextUrl(){return new URLSearchParams(location.search).get('next')||'/';}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.toggle('bg-zinc-900', b===btn); b.classList.toggle('text-zinc-400', b!==btn); });
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('hidden', p.dataset.tab !== btn.dataset.tab));
  err.textContent = '';
}));

fetch('/api/methods').then(r=>r.json()).then(m => {
  if (m.passkey) document.querySelector('[data-tab=passkey]').hidden = false;
  if (m.totp) document.querySelector('[data-tab=totp]').hidden = false;
});

document.getElementById('pane-password').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-pw'); btn.disabled = true;
  try {
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});
    const d = await r.json();
    if (r.ok) location.href = nextUrl(); else showErr(d.error||'Failed');
  } catch { showErr('Network error'); } finally { btn.disabled = false; }
});

document.getElementById('pane-totp').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-totp'); btn.disabled = true;
  try {
    const r = await fetch('/api/totp/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('totp').value})});
    const d = await r.json();
    if (r.ok) location.href = nextUrl(); else showErr(d.error||'Failed');
  } catch { showErr('Network error'); } finally { btn.disabled = false; }
});

document.getElementById('btn-pk').addEventListener('click', async () => {
  const btn = document.getElementById('btn-pk'); btn.disabled = true;
  try {
    const optsRes = await fetch('/api/passkey/login-options');
    if (!optsRes.ok) { showErr('No passkeys registered'); btn.disabled = false; return; }
    const opts = await optsRes.json();
    const cred = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: opts });
    const r = await fetch('/api/passkey/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cred)});
    const d = await r.json();
    if (r.ok) location.href = nextUrl(); else showErr(d.error||'Failed');
  } catch (err) {
    if (err.name !== 'NotAllowedError') showErr(err.message || 'Passkey failed');
  } finally { btn.disabled = false; }
});
</script></body></html>
